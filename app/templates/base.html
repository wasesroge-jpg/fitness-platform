<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Fitness Platform{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js" defer></script>
</head>
<body>
  <aside class="sidebar" aria-label="Навигация">
    <a href="{{ url_for('dashboard') }}" class="nav-icon {% if page=='dashboard' %}active{% endif %}" title="Дашборд" aria-label="Дашборд">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>
    </a>
    <a href="{{ url_for('calendar') }}" class="nav-icon {% if page=='calendar' %}active{% endif %}" title="Календарь" aria-label="Календарь">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18"/><path d="M8 3v4"/><path d="M16 3v4"/></svg>
    </a>
    <a href="{{ url_for('nutrition') }}" class="nav-icon {% if page=='nutrition' %}active{% endif %}" title="Питание" aria-label="Питание">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13a9 9 0 0 0 18 0"/><path d="M3 13h18"/><path d="M7 9c1.5-2 3.5-3 5-3s3.5 1 5 3"/></svg>
    </a>
    <a href="{{ url_for('ai_page') }}" class="nav-icon {% if page=='ai' %}active{% endif %}" title="AI Тренер" aria-label="AI Тренер">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4a3 3 0 0 0-3 3v1a3 3 0 0 0-2 5 3 3 0 0 0 2 5v1a3 3 0 0 0 3 3"/><path d="M15 4a3 3 0 0 1 3 3v1a3 3 0 0 1 2 5 3 3 0 0 1-2 5v1a3 3 0 0 1-3 3"/><path d="M12 4v16"/></svg>
    </a>
  </aside>

  <main class="main">
    {% block content %}{% endblock %}
  </main>

  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
